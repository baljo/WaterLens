# Runs the WaterLens network-control helper with access only to the host D-Bus socket needed by NetworkManager. 2026-09-08 21:16 Europe/Helsinki, Thomas Vikström.
services:
  networkcontrol:
    build:
      context: .
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    develop:
      watch:
        - action: rebuild
          path: Dockerfile
        - action: rebuild
          path: app
